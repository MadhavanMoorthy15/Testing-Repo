<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 50%, #0f0f1e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 191, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s infinite ease-in-out 2s;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        .calculator-container {
            position: relative;
            z-index: 10;
            background: rgba(20, 20, 45, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(138, 43, 226, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 360px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .display {
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.5) 0%, rgba(40, 40, 70, 0.5) 100%);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 24px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
            animation: displayGlow 0.4s ease-out;
        }

        @keyframes displayGlow {
            from {
                box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
            }
            to {
                box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3),
                           inset 0 0 20px rgba(138, 43, 226, 0.15);
            }
        }

        .previous-operand {
            font-size: 18px;
            color: rgba(200, 200, 220, 0.6);
            font-weight: 300;
            min-height: 24px;
            margin-bottom: 8px;
        }

        .current-operand {
            font-family: 'Courier Prime', monospace;
            font-size: 42px;
            color: #ffffff;
            font-weight: 700;
            word-wrap: break-word;
            word-break: break-all;
            line-height: 1.2;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            animation: buttonsIn 0.5s ease-out 0.1s both;
        }

        @keyframes buttonsIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        button {
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        /* Number buttons */
        .number, .decimal {
            background: linear-gradient(135deg, rgba(80, 80, 120, 0.6) 0%, rgba(60, 60, 100, 0.6) 100%);
            color: #ffffff;
            border: 1px solid rgba(138, 43, 226, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .number:hover, .decimal:hover {
            background: linear-gradient(135deg, rgba(100, 100, 140, 0.8) 0%, rgba(80, 80, 120, 0.8) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.3);
        }

        .number:active, .decimal:active {
            transform: translateY(0);
        }

        /* Operation buttons */
        .operation {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.8) 0%, rgba(75, 0, 130, 0.8) 100%);
            color: #ffffff;
            border: 1px solid rgba(200, 100, 255, 0.4);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        .operation:hover {
            background: linear-gradient(135deg, rgba(160, 60, 255, 1) 0%, rgba(100, 20, 150, 1) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.5);
        }

        .operation:active {
            transform: translateY(0);
        }

        /* Clear button */
        .clear-btn {
            background: linear-gradient(135deg, rgba(220, 100, 100, 0.8) 0%, rgba(180, 40, 40, 0.8) 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 150, 150, 0.4);
            box-shadow: 0 4px 15px rgba(220, 100, 100, 0.3);
        }

        .clear-btn:hover {
            background: linear-gradient(135deg, rgba(255, 120, 120, 1) 0%, rgba(220, 60, 60, 1) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 100, 100, 0.5);
        }

        .clear-btn:active {
            transform: translateY(0);
        }

        /* Delete button */
        .delete-btn {
            background: linear-gradient(135deg, rgba(100, 150, 200, 0.8) 0%, rgba(50, 100, 150, 0.8) 100%);
            color: #ffffff;
            border: 1px solid rgba(150, 200, 255, 0.4);
            box-shadow: 0 4px 15px rgba(100, 150, 200, 0.3);
            font-size: 16px;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, rgba(130, 180, 255, 1) 0%, rgba(80, 130, 180, 1) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 150, 200, 0.5);
        }

        .delete-btn:active {
            transform: translateY(0);
        }

        /* Equals button */
        .equals {
            background: linear-gradient(135deg, rgba(0, 200, 150, 0.9) 0%, rgba(0, 160, 120, 0.9) 100%);
            color: #ffffff;
            border: 1px solid rgba(100, 255, 200, 0.4);
            box-shadow: 0 4px 15px rgba(0, 200, 150, 0.3);
            grid-column: span 2;
            font-weight: 700;
            font-size: 20px;
        }

        .equals:hover {
            background: linear-gradient(135deg, rgba(20, 220, 170, 1) 0%, rgba(0, 180, 140, 1) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 200, 150, 0.5);
        }

        .equals:active {
            transform: translateY(0);
        }

        /* Ripple effect */
        button:active {
            position: relative;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .calculator-container {
                padding: 20px;
                max-width: 100%;
            }

            button {
                padding: 14px;
                font-size: 16px;
            }

            .current-operand {
                font-size: 32px;
            }

            .display {
                padding: 16px;
                min-height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="display">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>
        <div class="buttons-grid">
            <button class="clear-btn" id="clearBtn">AC</button>
            <button class="delete-btn" id="deleteBtn">DEL</button>
            <button class="operation" data-operation="÷">÷</button>
            <button class="operation" data-operation="×">×</button>
            
            <button class="number" data-number="7">7</button>
            <button class="number" data-number="8">8</button>
            <button class="number" data-number="9">9</button>
            <button class="operation" data-operation="-">−</button>
            
            <button class="number" data-number="4">4</button>
            <button class="number" data-number="5">5</button>
            <button class="number" data-number="6">6</button>
            <button class="operation" data-operation="+">+</button>
            
            <button class="number" data-number="1">1</button>
            <button class="number" data-number="2">2</button>
            <button class="number" data-number="3">3</button>
            <button class="decimal" data-number=".">.</button>
            
            <button class="number" data-number="0" style="grid-column: span 2;">0</button>
            <button class="equals" id="equalsBtn">=</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            delete() {
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                this.updateDisplay();
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                this.currentOperand = this.currentOperand.toString() + number.toString();
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        computation = prev / current;
                        break;
                    default:
                        return;
                }
                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            updateDisplay() {
                this.currentOperandElement.innerText = this.currentOperand || '0';
                if (this.operation != null) {
                    this.previousOperandElement.innerText = `${this.previousOperand} ${this.operation}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
            }
        }

        // Initialize calculator
        const previousOperandElement = document.getElementById('previousOperand');
        const currentOperandElement = document.getElementById('currentOperand');
        const calculator = new Calculator(previousOperandElement, currentOperandElement);

        // Number buttons
        document.querySelectorAll('[data-number]').forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.dataset.number);
            });
        });

        // Operation buttons
        document.querySelectorAll('[data-operation]').forEach(button => {
            button.addEventListener('click', () => {
                calculator.chooseOperation(button.dataset.operation);
            });
        });

        // Clear button
        document.getElementById('clearBtn').addEventListener('click', () => {
            calculator.clear();
        });

        // Delete button
        document.getElementById('deleteBtn').addEventListener('click', () => {
            calculator.delete();
        });

        // Equals button
        document.getElementById('equalsBtn').addEventListener('click', () => {
            calculator.compute();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') calculator.appendNumber(e.key);
            if (e.key === '.') calculator.appendNumber(e.key);
            if (e.key === '+' || e.key === '-') {
                e.preventDefault();
                calculator.chooseOperation(e.key === '+' ? '+' : '-');
            }
            if (e.key === '*') {
                e.preventDefault();
                calculator.chooseOperation('×');
            }
            if (e.key === '/') {
                e.preventDefault();
                calculator.chooseOperation('÷');
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculator.compute();
            }
            if (e.key === 'Backspace') {
                e.preventDefault();
                calculator.delete();
            }
            if (e.key === 'Escape') {
                calculator.clear();
            }
        });
    </script>
</body>
</html>
