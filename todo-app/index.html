<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Today's Tasks</h1>
            <p class="date" id="currentDate"></p>
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="What needs to be done today?" 
                autocomplete="off"
            >
            <button id="addBtn" onclick="addTodo()">Add Task</button>
        </div>

        <div class="stats">
            <span id="totalTasks">0 tasks</span>
            <span id="completedTasks">0 completed</span>
        </div>

        <ul class="todo-list" id="todoList">
            <!-- Todo items will be added here dynamically -->
        </ul>

        <div class="footer">
            <button class="clear-btn" onclick="clearCompleted()">Clear Completed</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
