<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 25%, #2d1b69 50%, #1a0033 75%, #0a0e27 100%);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Animated floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            animation: float1 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, transparent 70%);
            bottom: -150px;
            left: -50px;
            animation: float2 10s ease-in-out infinite;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            top: 50%;
            left: -100px;
            animation: float3 12s ease-in-out infinite;
        }

        .orb-4 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
            bottom: -100px;
            right: -150px;
            animation: float1 9s ease-in-out infinite reverse;
        }

        @keyframes float1 {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(30px) translateX(20px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-40px) translateX(-20px); }
        }

        @keyframes float3 {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(50px); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .login-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.9) 0%, rgba(50, 30, 80, 0.85) 100%);
            backdrop-filter: blur(20px);
            border: 2px solid;
            border-image: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #3b82f6 100%) 1;
            border-radius: 25px;
            padding: 70px 50px;
            box-shadow: 
                0 0 60px rgba(139, 92, 246, 0.3),
                0 0 100px rgba(236, 72, 153, 0.2),
                0 25px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #ec4899, transparent);
            border-radius: 25px 25px 0 0;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 45px;
            position: relative;
        }

        .logo-glow {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #3b82f6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 30px rgba(139, 92, 246, 0.8),
                0 0 60px rgba(236, 72, 153, 0.5);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(139, 92, 246, 0.8),
                    0 0 60px rgba(236, 72, 153, 0.5);
            }
            50% {
                box-shadow: 
                    0 0 50px rgba(139, 92, 246, 1),
                    0 0 100px rgba(236, 72, 153, 0.8);
            }
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #e0e7ff;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 28px;
            animation: slideUp 0.8s ease-out;
            animation-fill-mode: both;
            position: relative;
        }

        .form-group:nth-of-type(1) { animation-delay: 0.1s; }
        .form-group:nth-of-type(2) { animation-delay: 0.2s; }
        .form-group:nth-of-type(3) { animation-delay: 0.3s; }

        label {
            display: block;
            margin-bottom: 12px;
            color: #e0e7ff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(20, 10, 40, 0.8) 0%, rgba(40, 20, 60, 0.8) 100%);
            color: #e0e7ff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        input::placeholder {
            color: rgba(224, 231, 255, 0.4);
        }

        input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: linear-gradient(135deg, rgba(20, 10, 40, 0.95) 0%, rgba(40, 20, 60, 0.95) 100%);
            box-shadow: 
                inset 0 2px 8px rgba(0, 0, 0, 0.3),
                0 0 0 4px rgba(139, 92, 246, 0.2),
                0 0 20px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            font-size: 13px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #c4b5fd;
            cursor: pointer;
            font-weight: 500;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #8b5cf6;
            border-radius: 4px;
        }

        .forgot-password {
            background: linear-gradient(90deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 12px;
        }

        .forgot-password:hover {
            filter: brightness(1.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #3b82f6 100%);
            background-size: 200% 200%;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 
                0 0 20px rgba(139, 92, 246, 0.4),
                0 0 40px rgba(236, 72, 153, 0.3),
                0 15px 35px rgba(59, 130, 246, 0.2);
            animation: slideUp 0.8s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 0 30px rgba(139, 92, 246, 0.6),
                0 0 60px rgba(236, 72, 153, 0.5),
                0 20px 50px rgba(59, 130, 246, 0.4);
            background-position: 200% center;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(-2px);
        }

        .signup-link {
            text-align: center;
            margin-top: 32px;
            color: #c4b5fd;
            font-size: 13px;
            animation: slideUp 0.8s ease-out 0.4s both;
            font-weight: 500;
        }

        .signup-link a {
            background: linear-gradient(90deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
        }

        .signup-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #8b5cf6 0%, #ec4899 100%);
            transition: width 0.3s ease;
        }

        .signup-link a:hover::after {
            width: 100%;
        }

        .error-message {
            color: #ff6b9d;
            font-size: 12px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: none;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .error-message.show {
            display: block;
            opacity: 1;
        }

        .success-message {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(59, 130, 246, 0.1) 100%);
            border: 2px solid rgba(34, 197, 94, 0.5);
            color: #86efac;
            padding: 16px 18px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 28px;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: none;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .success-message.show {
            display: block;
            opacity: 1;
            animation: successPulse 0.6s ease-out;
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.95);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <div class="container">
        <div class="login-card">
            <div class="header">
                <div class="logo-glow">
                    <svg width="45" height="45" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="white" stroke-width="2"/>
                        <path d="M20 10v10M20 20v10" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="3" fill="white"/>
                    </svg>
                </div>
                <div class="logo">SecureAuth</div>
                <p class="subtitle">Premium Access Portal</p>
            </div>

            <div class="success-message" id="successMessage">
                ✓ Login successful! Redirecting...
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com" 
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="remember-forgot">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <p class="signup-link">
                Don't have an account? <a href="#">Create one</a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMessage = document.getElementById('successMessage');

        // Email validation regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Clear error on input
        emailInput.addEventListener('input', () => {
            emailError.classList.remove('show');
            emailError.textContent = '';
        });

        passwordInput.addEventListener('input', () => {
            passwordError.classList.remove('show');
            passwordError.textContent = '';
        });

        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            let isValid = true;

            // Validate email
            if (!emailInput.value.trim()) {
                emailError.textContent = 'Email is required';
                emailError.classList.add('show');
                isValid = false;
            } else if (!emailRegex.test(emailInput.value)) {
                emailError.textContent = 'Please enter a valid email';
                emailError.classList.add('show');
                isValid = false;
            }

            // Validate password
            if (!passwordInput.value.trim()) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.add('show');
                isValid = false;
            } else if (passwordInput.value.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                isValid = false;
            }

            // If valid, show success
            if (isValid) {
                successMessage.classList.add('show');
                form.style.opacity = '0.5';
                form.style.pointerEvents = 'none';

                // Simulate redirect after 2 seconds
                setTimeout(() => {
                    alert(`Login successful!\n\nEmail: ${emailInput.value}\nRemember me: ${document.getElementById('remember').checked ? 'Yes' : 'No'}`);
                    // In a real app, you'd redirect here
                    // window.location.href = '/dashboard';
                }, 2000);
            }
        });

        // Forgot password link
        document.querySelector('.forgot-password').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Password reset link would be sent to your email');
        });

        // Sign up link
        document.querySelector('.signup-link a').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Sign up page would open here');
        });
    </script>
</body>
</html>
